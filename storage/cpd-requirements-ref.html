        <script type="text/javascript">
            var pageData = { "result": {"components":[{"componentName":"heroBanner","componentData":{"ctaLinkItem":[{"link":{"name":"Pronouncement 7 V5.0 CPD","target":"_blank","url":"/media/fx4lvoq1/pronouncement-7-v50-cpd-17-feb-26.pdf"},"linkType":"Primary","linkIcon":"Information circle","linkIconClass":"InformationCircle","linkPosition":"False"}],"cardItems":null,"desktopImage":null,"mobileImage":null,"footnoteText":null,"tagline":"","backgroundGradientType":null,"footnoteLink":null,"id":null,"key":"9b00521d-431d-4b0a-8acf-134bd6ae894f","customCSSStyle":"","componentPadding":"","contentAlignment":"","backgroundConfiguration":null,"backgroundColor":null,"gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":"<h1 class=\"text-display-2xl md:text-display-3xl lg:text-display-4xl\">CPD Requirements</h1><p></p>","description":"<div>To support the evolving accounting profession, the IPA has introduced a more holistic CPD framework under the latest&nbsp;<strong>Pronouncement 7</strong>. This approach ensures Members maintain strong technical capability, professional skills and ethical standards, while upholding public interest and consumer protection.</div><p></p>"}},{"componentName":"tabbedContent","componentData":{"tabs":[{"tabLabel":"COMPETENCY ","tabIcon":null,"title":"<h4 style=\"text-align: left;\"></h4><p></p>","description":"<div></div><p style=\"text-align: left;\">Under Pronouncement 7, Members must complete CPD across <strong>three competency areas</strong>:</p><ul data-spread=\"true\"><li><p style=\"text-align: left;\"><strong><span class=\"text-gradient-purple-reverse\">Technical and Product Knowledge</span></strong><br>Core accounting, financial, regulatory and advisory expertise.</p></li><li><p><strong><span class=\"text-gradient-purple-reverse\">Management and Professional Skills</span></strong><br>Skills to lead, manage and operate effectively in a professional environment.</p></li><li><p style=\"text-align: left;\"><strong><span class=\"text-gradient-purple-reverse\">Professional and Ethical Standards</span></strong><br>Application of ethical principles, professional judgement and standards in the public interest.</p></li></ul><div></div><p></p>","desktopImage":null,"mobileImage":null,"ctaLinks":null,"tagline":""},{"tabLabel":"REQUIRED HOURS","tabIcon":null,"title":"<h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"></h5><p></p>","description":"<div></div><p style=\"text-align: left;\">Per year, members are required to complete <strong><span class=\"text-gradient-purple-reverse\">20 hours per competency area</span></strong>, made up of:</p><ul data-spread=\"false\" style=\"text-align: left;\"><li><p style=\"text-align: left;\">Minimum of<strong> <span class=\"text-gradient-purple-reverse\">15 verified hours</span></strong>, and</p></li><li><p style=\"text-align: left;\">Maximum<strong> <span class=\"text-gradient-purple-reverse\">5 unverified hours</span></strong></p></li></ul><p style=\"text-align: left;\">Equating to&nbsp;<span>a minimum of 120 hours over the CPD three-year period (new members entering a three-year period may meet obligations pro-rata).</span> This structure ensures a well-rounded and compliant CPD program.</p><p style=\"text-align: left;\">Members are required to keep a record of their CPD activities and maintain these records for a minimum of five years after the end of each three-year CPD period which may subject to the IPA Quality Review Program to ensure requirements are being met.</p><p style=\"text-align: left;\">For more information on CPD requirements read&nbsp;<a target=\"\" data-router-slot=\"disabled\" href=\"/media/fx4lvoq1/pronouncement-7-v50-cpd-17-feb-26.pdf\" title=\"Pronouncement 7 V5.0 CPD\">Pronouncement 7</a>, see our FAQ's or contact us.&nbsp;</p>","desktopImage":null,"mobileImage":null,"ctaLinks":null,"tagline":""}],"layoutStyle":"centered","defaultActiveTab":null,"id":null,"key":"d4cbab5c-2ef9-454d-931b-c2cccd086124","customCSSStyle":"","componentPadding":"","contentAlignment":"Center","backgroundConfiguration":null,"backgroundColor":null,"gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"<h5 class=\"text-display-md lg:text-display-lg\"><span class=\"text-secondary\">Examples of eligible CPD Activities</span><span class=\"text-gradient-purple-reverse\"><a id=\"Eligible-CPD-Activities\"></a></span></h5><p></p>","description":"<div>\n<div>\n<p data-pm-slice=\"1 1 []\">The below CPD activities may be counted within each competency area.</p>\n</div>\n<table border=\"1\" style=\"border-collapse: collapse; width: 100%;\" class=\"features-table_product\"><colgroup><col style=\"width: 33.2696%;\"><col style=\"width: 33.2696%;\"><col style=\"width: 33.2696%;\"></colgroup>\n<tbody>\n<tr>\n<td><span class=\"text-gradient-purple-reverse\"><strong>Technical &amp; Product Knowledge</strong></span></td>\n<td><span class=\"text-gradient-purple-reverse\"><strong>Management &amp; Professional Skills</strong></span></td>\n<td><span class=\"text-gradient-purple-reverse\"><strong>Professional &amp; Ethical Standards</strong></span></td>\n</tr>\n<tr>\n<td>\n<ul data-spread=\"false\" data-pm-slice=\"3 3 []\">\n<li>\n<p>Financial and management accounting</p>\n</li>\n<li>\n<p>Financial reporting</p>\n</li>\n<li>\n<p>Taxation</p>\n</li>\n<li>\n<p>Auditing and assurance</p>\n</li>\n<li>\n<p>Integrated, sustainability and environmental reporting</p>\n</li>\n<li>\n<p>Business law and regulation</p>\n</li>\n<li>\n<p>Governance and business strategy</p>\n</li>\n<li>\n<p>Superannuation and SMSFs</p>\n</li>\n<li>\n<p>Public sector accounting</p>\n</li>\n<li>\n<p>Charities and not-for-profits</p>\n</li>\n<li>\n<p>Financial advice</p>\n</li>\n</ul>\n</td>\n<td>\n<ul data-spread=\"false\" data-pm-slice=\"3 3 []\">\n<li>\n<p>Interpersonal and communication skills</p>\n</li>\n<li>\n<p>Personal development</p>\n</li>\n<li>\n<p>Practice management, leadership and negotiation</p>\n</li>\n<li>\n<p>Cyber security and technology</p>\n</li>\n<li>\n<p>Problem solving and decision-making</p>\n</li>\n<li>\n<p>Mental health training</p>\n</li>\n<li>\n<p>Productivity and business processes</p>\n</li>\n<li>\n<p>Corporate Social Responsibility</p>\n</li>\n</ul>\n</td>\n<td>\n<ul data-spread=\"false\" data-pm-slice=\"3 3 []\">\n<li>\n<p>Application of the <strong>APES 110 Code of Ethics</strong></p>\n</li>\n<li>\n<p>Relevant standards, guidance and pronouncements issued by the Accounting Professional and Ethical Standards Board</p>\n</li>\n<li>\n<p>Other statutory Codes of Ethics or Professional Conduct</p>\n</li>\n<li>\n<p>Ethical decision-making and dilemma resolution</p>\n</li>\n<li>\n<p>Professional judgement and scepticism</p>\n</li>\n<li>\n<p>The role and value of accountants within the community</p>\n</li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table>\n</div>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"","columnContentAlignment":"","id":null,"key":"df484545-f84b-41df-a5f8-601148131c29","customCSSStyle":"","componentPadding":"","contentAlignment":"","backgroundConfiguration":null,"backgroundColor":null,"gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}}],"navigation":{"siteLogo":{"src":"/media/gv1ly4ki/80726_w_logo.png?rmode=max&width=101&height=83","altText":"","target":null},"siteLogoMobile":{"src":"/media/gv1ly4ki/80726_w_logo.png?rmode=max&width=101&height=83","altText":"","target":null},"mobileStickyNavigationItems":[],"items":[],"headerDataSource":{"megaMenuColumns":[{"title":"About IPA","sections":[{"mainMenuLink":[{"link":{"name":"About the IPA","target":null,"url":"/about-ipa/about-the-ipa/"},"linkType":"Primary","linkIcon":"","linkIconClass":""
