        <script type="text/javascript">
            var pageData = { "result": {"components":[{"componentName":"heroBanner","componentData":{"ctaLinkItem":null,"cardItems":null,"desktopImage":null,"mobileImage":null,"footnoteText":null,"tagline":"","backgroundGradientType":null,"footnoteLink":null,"id":null,"key":"81b1f1d6-5291-4f09-97f7-b2eb9d5fa71a","customCSSStyle":"","componentPadding":"","contentAlignment":"","backgroundConfiguration":null,"backgroundColor":null,"gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":"<h1 class=\"text-display-2xl md:text-display-3xl lg:text-display-4xl\">Board of Directors</h1>","description":"<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\">The Board of Directors guides our strategic direction and ensures strong governance across the Institute of Public Accountants. With deep connections in industry and government, our Board members are committed to advancing the accounting profession and serving the best interests of our members and the broader accounting community.</p>"}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/cmxbml5n/ipa_cheryl-mallett001.jpg?rmode=max&amp;width=209&amp;height=314\" alt=\"IPA_Cheryl Mallett001.jpg\" width=\"209\" height=\"314\"></p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><strong><span class=\"text-2xl text-warm-plum\">President</span></strong></h5><h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Cheryl Mallett FIPA CTA SSA GAICD</strong></h5><p></p>","description":"<p><span class=\"text-md\">Cheryl has been an IPA member since 1996 and a Board member since November 2018. As a graduate of the Australian Institute of Company Directors, Cheryl has more than 30 years’ experience as an income tax specialist/advisor. She is also an Accredited Specialist SMSF Advisor and SMSF Auditor. Winner of the 2016 IPA Northern Territory and National Practice of the Year and 2019 AMP Women in Finance – Regional Professional of the Year. Cheryl was appointed President and Board Chair in 2023, having previously held the positions of Deputy President of the IPA and Chair of the Board Audit and Risk Committee. She is Chair of the Board Executive and Nominations Committees. She is also a Director of the Association of Accounting Technicians (AAT) which sits within the IPA.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"71738af1-30ec-42ec-bd8d-186d05ded5c4","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/1qtpzrol/ipa_julie-williams007_whitebg.jpg?rmode=max&amp;width=212&amp;height=318\" alt=\"IPA_Julie Williams007_WhiteBG.jpg\" width=\"212\" height=\"318\"></p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><span class=\"text-2xl text-warm-plum\"><strong>Immediate Past President</strong></span></h5>\n<h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Julie Williams FIPA FFA</strong></h5>","description":"<p style=\"text-align: left;\"><span class=\"text-md\">Julie has been an IPA member since 2003 and a Board member since 2017. Julie has held various leadership roles in the IPA, including Board President and Group Chair for three years. She also held the positions of Deputy President, Chair of the Disciplinary Committee and the Nominations Committee. Julie is the current Chair of the Education Advisory Panel, President and Director of the IFA and serves on various committees. She has over 25 years of experience in Insolvency and was a partner in PPB before moving to public practice as a Registered Liquidator in 2006. Julie holds an MBA and an MPA, is a Fellow of the IPA, CPA and the Australian Restructuring Insolvency and Turnaround Association. She is a member of the Australian Institute of Company Directors, the Association of Independent Insolvency Practitioners and an affiliate of the Association of Certified Fraud Examiners.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"15f10692-6284-455d-9682-e5ec6f9a32ad","customCSSStyle":"","componentPadding":"24","contentAlignment":"","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/tiojpbjk/ipa-annette-tasker107.jpg?rmode=max&amp;width=208&amp;height=312\" alt=\"IPA Annette Tasker107.jpg\" width=\"208\" height=\"312\"></p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><span class=\"text-2xl text-warm-plum\"><strong>Deputy President</strong></span></h5>\n<h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Annette Tasker FIPA FFA</strong></h5>","description":"<p><span class=\"text-md\">As a proud recipient of the NSW IPA Member of the Year award and a passionate FIPA, Annette has contributed in roles within the NSW Divisional Advisory Council and is a graduate of the Australian Institute of Company Directors. Her diverse career journey includes running a successful family manufacturing business, having a side hustle of a bookkeeping practice, and eventually transforming it into a thriving accounting and tax practice. Annette’s experiences have come full circle, emphasizing the importance of sustainable business practices while managing work-life pressures. She serves on various community-based committees, including as a Patrol Captain at Cronulla Surf Club.</span></p><p></p><p><span class=\"text-md\">Annette currently serves as a Deputy President, actively participates in the Board Executive Committee, and Chairs the Board Membership Committee. Additionally, she has lent her expertise to the ICT Steering Committee and previously Chaired the Board Audit and Risk Committee.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"4e22cc15-7ea6-4d74-957b-91d1e72e15b5","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/33cbpn1j/ipa_richard-allen007.jpg?rmode=max&amp;width=210&amp;height=315\" alt=\"IPA_Richard Allen007.jpg\" width=\"210\" height=\"315\"></p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><span class=\"text-2xl text-warm-plum\"><strong>Deputy President</strong></span></h5>\n<h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Richard Allen FIPA FFA</strong></h5>","description":"<p><span class=\"text-md\">Richard has been a member of the IPA since 2005 and has been in public practice since 1986. He has served as the South Australian/Northern Territory Divisional President and as President of the Council of Divisional Presidents. Richard has degrees in Arts/Economics and Accounting and has been a Registered Tax Agent since 1995. He served on the Board of the Sturt Football Club for 11 years (including six as President) and continued serving football in SA as a Commissioner for the SANFL for a further 10 years. Richard started his own accounting firm 30 years ago. His firm had a joint venture with Johnston Grocke for three years where he was a Director of their Business Advisory &amp; Accounting team. He is now practicing solely as Allen &amp; Co Accountants.</span></p><p></p><p><span class=\"text-md\">Richard is a Deputy President, actively participates in the Board Executive Committee and currently sits on the Board Membership Committee. He previously Chaired the Board Audit and Risk Committee and was a member of the Board Disciplinary Tribunal.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"c5b65aae-dc20-49f5-8315-f3ce96db9054","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/rn1bd1be/image.png?rmode=max&amp;width=209&amp;height=279\" width=\"209\" height=\"279\">  </p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><span class=\"text-2xl text-warm-plum\"><strong>Director</strong></span></h5>\n<h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Dr Mark Pizzacalla FIPA FFA</strong></h5>","description":"<p><span class=\"text-md\">Dr Mark Pizzacalla is a Senior Partner with BDO. Mark has over 30 years of business and tax experience, including being formerly appointed by the Federal Government to Australia’s Board of Taxation, providing ‘real time’ policy advice to the Federal Treasurer. Mark’s business experience, including as Director for various corporates and for BDO’s national practice, gives him strong insights into both the strategic and operational issues facing his clients, and provides relevance to the advice that he delivers. Mark is a regular expert commentator and presenter on business and tax issues, having contributed significant commentary through media and publications, including Lateline Business and The Australian Financial Review. Mark completed his PhD in relation to the taxation of SMEs in Australia and is one of the few tax practitioners whose work has been cited in Australia’s Parliament. A number of Mark’s recommendations have been adopted as law by the Federal Government.</span></p><p></p><p><span class=\"text-md\">Mark was appointed a Director in November 2023 and currently Chairs the Board Audit and Risk Committee. He previously served on the Board Membership Committee.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"8945f770-2a1f-40c8-adbe-ed7748bd80aa","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p><img src=\"/media/zpyfzqgz/image.png?rmode=max&amp;width=207&amp;height=269\" width=\"207\" height=\"269\"></p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><strong><span class=\"text-2xl text-warm-plum\">Director</span></strong></h5><h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Alan Pecotic FIPA FFA</strong></h5><p></p>","description":"<p><span class=\"text-md\">Alan is a Chartered Accountant and has over 25 years’ experience in the accounting industry . He is a Director of Integrated Accounting Group, a Chartered Accounting and Business Advisory Firm that specialises in providing corporate advisory, taxation and wealth creation solutions to a wide range of small to medium sized enterprises, high net worth individuals and professional businesses.</span></p><p></p><p><span class=\"text-md\">Alan is a non-executive director of many businesses and holds various roles within the WA Sporting Industry whilst also being a Board Member at Christ the King Primary School. Alan is a member of the Australian Institute of Company Directors, holds a Diploma in Financial Planning and was the IPA Member of the Year for Western Australia in 2021.</span></p><p></p><p><span class=\"text-md\">Formerly the President of the WA Divisional Advisory Committee, Alan was appointed a Director of the IPA in 2023 and currently sits on the Board Membership Committee. Previously, Alan sat on the Board Audit and Risk Committee.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"959399dc-007f-47d6-87fb-1e284d1bf3b9","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"></p><p><img src=\"/media/qxzktwd1/image.png?rmode=max&width=208&height=268\" width=\"208\" height=\"268\"></p><p>    </p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><span class=\"text-2xl text-warm-plum\"><strong>Director</strong></span></h5>\n<h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Frank Petruzzelli FIPA FFA</strong></h5>","description":"<p><span class=\"text-md\">Frank is a Director of MDB Accountants and Business Advisors Pty Ltd and has over 38 years of Tax experience having worked in public Practice all his life. He is a Registered Tax Agent since 1985 and a member of the IPA since July 2004. Frank has held various ASX Listed Company board positions including Oil and Gas exploration Companies in the USA and Daimond exploration Companies located in Africa. He was the founder and major Shareholder of these Companies and has raised over $50m capital on the ASX.</span></p><p></p><p><span class=\"text-md\">He is a Co-Founder of a Not-for-Profit Charity recently established to deliver Vocational training to people living in Asia and then placing them in employment. The first project will deliver horticultural training to 90 disadvantaged people living in the rural province of Hau Giang Vietnam. Frank is a passionate Formula One fanatic and loves restoring</span></p><p><span class=\"text-md\">classic cars in his spare time. He was appointed a Director in November 2024 and currently sits on the Board Audit and Risk Committee.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"dfcfef92-d0f8-458e-924c-33b70b4c7316","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/am0praoy/image.png?rmode=max&amp;width=209&amp;height=209\" width=\"209\" height=\"209\">  </p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><strong><span class=\"text-2xl text-warm-plum\">Director</span></strong></h5><h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Larissa Karpish </strong></h5><p></p>","description":"<p><span class=\"text-md\">Larissa is the Assistant Director, Budget Strategy Division, Australian Government Department of Health, which is focused on supporting proposals for consideration in the Federal Budget context. Her previous roles in the department have included leading the delivery of external communications for the Medicare Benefits Schedule Review, reporting on funding agreements with the states and territories in the aged care sector, and supporting the Royal Commission into Aged Care Quality and Safety Taskforce.</span></p><p></p><p><span class=\"text-md\">In her public sector roles, Larissa has advised the Australian Government in diverse areas, including prudential regulation, corporate governance, financial markets reforms, investor protections, corporations laws, housing and rental schemes, the income support system and health products regulation. Larissa was appointed a Director in November 2025 and currently sits on the Board Audit and Risk Committee.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"bf78c616-003f-4c0d-883b-62fa4fbf2874","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/suwhymzv/image.png?rmode=max&width=213&height=283\" width=\"213\" height=\"283\"></p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><strong><span class=\"text-2xl text-warm-plum\">Director</span></strong></h5><h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Duncan Walker FFA FIPA</strong></h5><p></p>","description":"<p><span class=\"text-md\">Duncan is an experienced finance and business leader with a distinguished career spanning banking, accountancy, and executive advisory roles. In 1998, he founded his own award-winning accountancy and business training practice. His career has since included executive leadership positions such as Chief Executive of the West Lothian Chamber of Commerce, High Growth Business Advisor for Business Gateway Midlothian, and Managing Director of Duncan Walker Partnership Ltd until its sale in 2023.</span></p><p></p><p><span class=\"text-md\">A Chartered Banker and Fellow of multiple professional bodies, Duncan has held numerous governance and advisory roles, including chairing and serving on councils for the Chartered Institute of Bankers in Scotland, CIPD, the Institute of Financial Accountants, and the Scottish Chamber of Commerce. He is currently the Part-Time Treasurer for the United Reformed Church National Synod of Scotland. Duncan was appointed a Director in November 2025 and currently sits on the Board Audit and Risk Committee.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"fd7b1007-f86d-43bf-929c-34182713f459","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}}],"navigation":{"siteLogo":{"src":"/media/gv1ly4ki/80726_w_logo.png?rmode=max&width=101&height=83","altText":"","target":null},"siteLogoMobile":{"src":"/media/gv1ly4ki/80726_w_logo.png?rmode=max&width=101&height=83","altText":"","target":null
