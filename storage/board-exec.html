        <script type="text/javascript">
            var pageData = { "result": {"components":[{"componentName":"heroBanner","componentData":{"ctaLinkItem":null,"cardItems":null,"desktopImage":null,"mobileImage":null,"footnoteText":null,"tagline":"","backgroundGradientType":null,"footnoteLink":null,"id":null,"key":"25377914-082e-49a9-a01a-461691ef7815","customCSSStyle":"","componentPadding":"","contentAlignment":"","backgroundConfiguration":null,"backgroundColor":null,"gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":"<h1 class=\"text-display-2xl md:text-display-3xl lg:text-display-4xl\">Board Executive Committee</h1>","description":"<p>The Board Executive Committee provides strategic leadership and governance oversight for the Institute of Public Accountants. Comprising experienced professionals from across the accounting and business sectors, the Committee guides the Institute's direction and upholds the highest standards of professional practice.&nbsp;</p>"}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/cmxbml5n/ipa_cheryl-mallett001.jpg?rmode=max&amp;width=209&amp;height=314\" alt=\"IPA_Cheryl Mallett001.jpg\" width=\"209\" height=\"314\"></p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><strong><span class=\"text-2xl text-warm-plum\">President</span></strong></h5><h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Cheryl Mallett FIPA CTA SSA GAICD&nbsp;</strong></h5><p></p>","description":"<p style=\"text-align: left;\"><span class=\"text-md\">Cheryl has been an IPA member since 1996 and a Board member since November 2018. As a graduate of the Australian Institute of Company Directors, Cheryl has more than 30 years’ experience as an income tax specialist/advisor. She is also an Accredited Specialist SMSF Advisor and SMSF Auditor. Winner of the 2016 IPA Northern Territory and National Practice of the Year and 2019 AMP Women in Finance – Regional Professional of the Year. Cheryl was appointed President and Board Chair in 2023, having previously held the positions of Deputy President of the IPA and Chair of the Board Audit and Risk Committee. She is Chair of the Board Executive and Nominations Committees. She is also a Director of the Association of Accounting Technicians (AAT) which sits within the IPA.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"4ba818d9-3b18-45fd-a904-fb94f9c3f208","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/1qtpzrol/ipa_julie-williams007_whitebg.jpg?rmode=max&amp;width=210&amp;height=316\" alt=\"IPA_Julie Williams007_WhiteBG.jpg\" width=\"210\" height=\"316\"></p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><strong><span class=\"text-2xl text-warm-plum\">Immediate Past President</span></strong></h5><h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Julie Williams FIPA FFA FCPA FARITA</strong></h5><p></p>","description":"<p style=\"text-align: left;\"><span class=\"text-md\">Julie has been an IPA member since 2003 and a Board member since 2017. Julie has held various leadership roles in the IPA, including Board President and Group Chair for three years. She also held the positions of Deputy President, Chair of the Disciplinary Committee and the Nominations Committee. Julie is the current Chair of the Education Advisory Panel, President and Director of the IFA and serves on various committees. She has over 25 years of experience in Insolvency and was a partner in PPB before moving to public practice as a Registered Liquidator in 2006. Julie holds an MBA and an MPA, is a Fellow of the IPA, CPA and the Australian Restructuring Insolvency and Turnaround Association. She is a member of the Australian Institute of Company Directors, the Association of Independent Insolvency Practitioners and an affiliate of the Association of Certified Fraud Examiners.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"a4cd1ffb-96f8-4846-a592-e85d31e9dfc1","customCSSStyle":"","componentPadding":"24","contentAlignment":"","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/tiojpbjk/ipa-annette-tasker107.jpg?rmode=max&amp;width=209&amp;height=314\" alt=\"IPA Annette Tasker107.jpg\" width=\"209\" height=\"314\"></p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><span class=\"text-2xl text-warm-plum\"><strong>Deputy President</strong></span></h5>\n<h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Annette Tasker FIPA FFA</strong></h5>","description":"<p style=\"text-align: left;\"><span class=\"text-md\">As a proud recipient of the NSW IPA Member of the Year award and a passionate FIPA, Annette has contributed in roles within the NSW Divisional Advisory Council and is a graduate of the Australian Institute of Company Directors. Her diverse career journey includes running a successful family manufacturing business, having a side hustle of a bookkeeping practice, and eventually transforming it into a thriving accounting and tax practice. Annette’s experiences have come full circle, emphasizing the importance of sustainable business practices while managing work-life pressures. She serves on various community-based committees, including as a Patrol Captain at Cronulla Surf Club.</span></p><p></p><p><span class=\"text-md\">Annette currently serves as a Deputy President, actively participates in the Board Executive Committee, and Chairs the Board Membership Committee. Additionally, she has lent her expertise to the ICT Steering Committee and previously Chaired the Board Audit and Risk Committee.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"5a49a6fb-b07e-4616-8359-3b42e28007e3","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p style=\"text-align: left;\"><img src=\"/media/33cbpn1j/ipa_richard-allen007.jpg?rmode=max&amp;width=210&amp;height=315\" alt=\"IPA_Richard Allen007.jpg\" width=\"210\" height=\"315\"></p>","tagline":"","ctaLinkItem":[]},{"title":"<h5 style=\"text-align: left;\"><span class=\"text-2xl text-warm-plum\"><strong>Deputy President</strong></span></h5>\n<h5 class=\"text-display-md lg:text-display-lg\" style=\"text-align: left;\"><strong>Richard Allen FIPA FFA</strong></h5>","description":"<p style=\"text-align: left;\"><span class=\"text-md\">Richard has been a member of the IPA since 2005 and has been in public practice since 1986. He has served as the South Australian/Northern Territory Divisional President and as President of the Council of Divisional Presidents. Richard has degrees in Arts/Economics and Accounting and has been a Registered Tax Agent since 1995. He served on the Board of the Sturt Football Club for 11 years (including six as President) and continued serving football in SA as a Commissioner for the SANFL for a further 10 years. Richard started his own accounting firm 30 years ago. His firm had a joint venture with Johnston Grocke for three years where he was a Director of their Business Advisory &amp; Accounting team. He is now practicing solely as Allen &amp; Co Accountants.</span></p><p></p><p><span class=\"text-md\">Richard is a Deputy President, actively participates in the Board Executive Committee and currently sits on the Board Membership Committee. He previously Chaired the Board Audit and Risk Committee and was a member of the Board Disciplinary Tribunal.</span></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"20-80","columnContentAlignment":"","id":null,"key":"ebbb8b28-dca6-4597-b97c-b8fa172c8105","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}}],"navigation":{"siteLogo":{"src":"/media/gv1ly4ki/80726_w_logo.png?rmode=max&width=101&height=83","altText":"","target":null},"siteLogoMobile":{"src":"/media/gv1ly4ki/80726_w_logo.png?rmode=max&width=101&height=83","altText":"","target":null},"mobileStickyNavigationItems":[],"items":[],"headerDataSource":{"megaMenuColumns":[{"title":"About IPA","sections":[{"mainMenuLink":[{"link":{"name":"About the IPA","target":null,"url":"/about-ipa/about-the-ipa/"},"linkType":"Primary","linkIcon":"","linkIconClass":"","linkPosition":"False"}],"menuLinksL2":[{"link":{"name":"Contact Us","target":"","url":"/about-ipa/about-the-ipa/contact-us/"},"linkType":"Text","linkIcon":"Arrow right","linkIconClass":"ArrowRight","linkPosition":
