        <script type="text/javascript">
            var pageData = { "result": {"components":[{"componentName":"articleHeader","componentData":{"desktopImage":{"src":"/media/azth1lvw/istock-1558174792.jpg?rmode=max&width=1254&height=836","altText":"","target":null},"mobileImage":{"src":"/media/azth1lvw/istock-1558174792.jpg?rmode=max&width=1254&height=836","altText":"","target":null},"shareIconsToggle":true,"publicationDate":"2026-01-31T00:00:00","tags":["Artificial Intelligence (AI) and Automation"],"socialPlatforms":{"label":"Share","socialPlatforms":[{"platform":"Facebook/","url":"https://www.facebook.com/sharer/sharer.php?u={URL}","shareTextTemplate":"","icon":{"src":"/media/z15gctj2/icons_base.png?rmode=max&width=24&height=24","altText":"","target":null}},{"platform":"LinkedIn","url":"https://www.linkedin.com/shareArticle?mini=true&url={URL}&title={TITLE}&summary={DESC}","shareTextTemplate":"","icon":{"src":"/media/dqwh23f1/icon-li.png?rmode=max&width=0&height=0","altText":"","target":null}},{"platform":"X","url":"https://twitter.com/intent/tweet?url={URL}&text={TEXT}&hashtags={HASHTAGS}","shareTextTemplate":"","icon":{"src":"/media/lobpfwkc/icons_base.png?rmode=max&width=20&height=20","altText":"","target":null}}],"layout":"Inline","id":null,"key":"c16b3128-c2d9-4655-9af7-447dd29ad011","customCSSStyle":"","componentPadding":"","contentAlignment":"","backgroundConfiguration":null,"backgroundColor":null,"gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null},"id":null,"key":"d3d87f8d-3f60-4c6f-bb69-40e4e0369d5f","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"F2F2F2","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":"<h2 class=\"text-display-2xl lg:text-display-3xl\">Five defences in your fight against cyber villains</h2><div>By Cameron Cooper</div><p></p>","description":null}},{"componentName":"articleContainer","componentData":{"articleComponents":[{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"","description":"<p>In 2026, cybersecurity feels more and more like a James Bond thriller – but with voice cloning and deepfakes instead of explosions. These five checklists can help you fight the newest cyber threats.</p><p></p><p>As AI supercharges cybercrime in 2026, governments and professional services firms are bracing for smarter and more relentless digital threats.</p><p></p><p><a target=\"_blank\" data-router-slot=\"disabled\" href=\"https://services.google.com/fh/files/misc/cybersecurity-forecast-2026-en.pdf\" title=\"services.google.com\" type=\"external\">Google’s Cybersecurity Forecast 2026</a> predicts an acceleration of AI-enabled social engineering that enhancing the speed, scope and impact of threats. This includes more sophisticated “vishing” attacks in which scammers use deepfake voice or video communication to trick people into disclosing personal information.</p><p></p><p>Such threats are not new. But many experts say AI-driven cloning will heighten such risks through “hyper-realistic impersonations” of executives or IT staff, making attacks harder to detect and defend.</p><p></p><p><strong>Checklist 1:</strong> The Google report suggests that:</p><ul><li><p>Cyber thieves will adopt agentic systems– autonomous AI systems that can perceive, reason, plan, and act independently – to streamline and scale their attacks.</p></li><li><p>Ransomware threats will keep evolving.</p></li><li><p>We will see an increase in “shadow-AI” threats, as employees use AI tools without IT leaders’ knowledge at a time when nation states are exploiting cloud and cryptocurrency vulnerabilities.</p></li><li><p>We will also see more “shadow agent” issues, where companies’ use of AI agents for work tasks exposing them to potential data leaks, compliance violations and intellectual property theft.</p></li><li><p>There will be a rise in “prompt injection” threats – attacks that manipulate AI to make it bypass security protocols and follow an attacker’s hidden commands.</p></li></ul><p>Simone Herbert-Lowe, who leads the cyber, media and technology practice in Australia for global law firm Clyde &amp; Co, says the flip side is that cybersecurity teams can also draw on AI to bolster security operations.</p><p></p><p>“AI can be used to detect suspicious patterns, including insider risks if there is an unusual amount of sensitive information or data being exfiltrated or exported out of a system,” she says.</p><p></p><p>Herbert-Lowe urges accounting firms to treat cyber threats as a professional and business risk, not just a technology risk. “Accountants are in a real position of trust with their clients and they often collect information that is sensitive and can be used for financial crimes.”</p><p>They should also be mindful of obligations to report notifiable data breaches under Australia’s Privacy Act.</p><p></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"","columnContentAlignment":"","id":null,"key":"babbf6fd-1611-491f-b48e-e6494d24a493","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null},"jumpToId":"component-babbf6fd-1611-491f-b48e-e6494d24a493","sidebarMenuTitle":"Introduction"},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"<p class=\"text-display-sm lg:text-display-md\"><span class=\"text-2xl\"><strong>New and ‘refined’ threats</strong></span></p><p></p>","description":"<p>There is a growing fear that AI will <a target=\"\" data-router-slot=\"disabled\" href=\"https://www.forbes.com/sites/emilsayegh/2025/12/12/ten-cybersecurity-predictions-that-will-define-2026/?utm_source=chatgpt.com\" data-anchor=\"?utm_source=chatgpt.com\" title=\"www.forbes.com\" type=\"external\">lower the barrier to entry for cyber criminals</a> while enabling them to better research targets and generate ever-more convincing cyber-attack communications that go well beyond the old scam emails and accidental malware downloads.</p><p></p><p>Mark Whittley is co-founder and managing director of Sicarius, an Australian cyber defence firm specialising in small and medium enterprises (SMEs). He believes 2026 is shaping as a “James Bond moment” when voice cloning, deepfakes and vishing make cybersecurity “feel like an espionage thriller”.</p><p></p><p>However, he says the biggest risk for governments and businesses will come from the refinement of cyber attacks that exploit routine business behaviour, rather than the emergence of new threats. “Vishing, business email compromise and AI-assisted impersonation are effective precisely because they look ordinary,” Whittley says.</p><p></p><p>Attackers understand that they do not need to breach sophisticated systems if they can persuade employees to compromise security protocols with tailored and believable scams.</p><p></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"","columnContentAlignment":"","id":null,"key":"a3684586-e0eb-4485-9fc7-1013610ad682","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":null,"backgroundColor":null,"gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null},"jumpToId":"component-a3684586-e0eb-4485-9fc7-1013610ad682","sidebarMenuTitle":"New and ‘refined’ threats"},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"<p><span class=\"text-2xl\"><strong>C-suites on edge</strong></span></p>","description":"<p>In such an environment, AI-driven threats have C-suite teams in a sweat. The 2026 Tech Trends and Priorities Global Pulse Poll from <a target=\"_blank\" data-router-slot=\"disabled\" href=\"https://www.isaca.org/resources/news-and-trends/isaca-now-blog/2025/isaca-2026-tech-trends-and-priorities-pulse-poll-reinforces-high-stakes-of-ai-preparedness\" title=\"www.isaca.org\" type=\"external\">global IT organisation ISACA </a>indicates that regulatory complexity and business continuity will dominate the agendas of Australia’s technology and security leaders in 2026.</p><p><em>“Many businesses still think … ‘we’re too small to matter.’ Attackers do not think in those terms.”</em></p><p>MARK WHITTLEY, SICARIUS</p><p></p><p>The survey findings reveal that fewer than half of respondents are extremely or very confident their organisation can successfully navigate a ransomware attack. In Oceania, 67% of respondents say AI-driven cyber threats and deepfakes will be their main headache, while 45% worry most about reputational damage caused by failing to detect or respond to a major breach.</p><p></p><p><strong>Checklist 2</strong>– <a target=\"_blank\" data-router-slot=\"disabled\" href=\"https://www.isaca.org/about-us/newsroom/press-releases/2025/new-isaca-research-identifies--what-will-keep-tech-pros-up-at-night-in-2026\" title=\"www.isaca.org\" type=\"external\">ISACA identifies key steps to stay cyber-safe</a>, including:</p><ul><li><p>establishing robust AI governance and risk frameworks;</p></li><li><p>accelerating workforce upskilling and talent pipeline development;</p></li><li><p>modernising legacy systems to reduce vulnerabilities;</p></li><li><p>developing and regularly testing incident-response plans; and</p></li><li><p>focusing on regulatory complexity and international compliance requirements.</p></li></ul><p>Whittley adds that smaller entities, in particular, need a change of mindset. “Many businesses still think, ‘we’re not Medibank or Optus – why would anyone target us?’, or ‘we’re too small to matter.’ Attackers do not think in those terms.”</p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"","columnContentAlignment":"","id":null,"key":"3e4a45cf-40a0-4e63-9dec-36832fa3afa1","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":null,"backgroundColor":null,"gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null},"jumpToId":"component-3e4a45cf-40a0-4e63-9dec-36832fa3afa1","sidebarMenuTitle":"C-suites on edge"},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"<p><span class=\"text-2xl\"><strong>Cybersecurity hygiene the key</strong></span></p>","description":"<p>As part of its <a target=\"\" data-router-slot=\"disabled\" href=\"https://emt.gartnerweb.com/ngw/globalassets/en/technical-professionals/documents/2026-planning-guide-for-cybersecurity.pdf?_gl=1*18u72y2*_gcl_au*MTIxMzAxNTQyOC4xNzY3MzI3NTk2LjE2ODM1MDMyNjYuMTc2NzY2NTc0NS4xNzY3NjY1Nzgz*_ga*MTA3ODQ1MjE0LjE3NjczMjc1OTE.*_ga_R1W5CE5FEV*czE3Njc2NjUxNDckbzIkZzEkdDE3Njc2NjU3OTQkajEwJGwwJGgw\" data-anchor=\"?_gl=1*18u72y2*_gcl_au*MTIxMzAxNTQyOC4xNzY3MzI3NTk2LjE2ODM1MDMyNjYuMTc2NzY2NTc0NS4xNzY3NjY1Nzgz*_ga*MTA3ODQ1MjE0LjE3NjczMjc1OTE.*_ga_R1W5CE5FEV*czE3Njc2NjUxNDckbzIkZzEkdDE3Njc2NjU3OTQkajEwJGwwJGgw\" title=\"emt.gartnerweb.com\" type=\"external\">2026 Planning Guide for Cybersecurity</a>, Gartner warns that many organisations are focusing “too much on sophisticated attacks and not enough on basic cybersecurity hygiene and incident response practices”. That, it says, leaves them exposed to ransomware and account takeover risks.</p><p></p><p>Given the volume of financial information and data that accounting firms collect and store, Herbert-Lowe says getting the basics right will be especially crucial as threats rise.</p><p></p><p><strong>Checklist 3</strong> – Herbert-Lowe’s list of basics includes:</p><ul><li><p>exchanging sensitive information through a secure portal, not standard email platforms;</p></li><li><p>using multi-factor authentication to safeguard emails and data; and</p></li><li><p>educating staff on cyber safeguards.</p></li></ul><p>Herbert-Lowe warns that payment redirection fraud will be a particular risk for accounting firms in 2026 as cyber criminals try to deceive employees into transferring funds to a bogus account.</p><p></p><p>Whittley agrees that significant risks for accounting firms will include impersonation, payment redirection fraud and unauthorised access to sensitive client data. “These risks are amplified by trust – both the trust clients place in their accountant and the trust accountants place in familiar communications,” he says.</p><p></p><p>He says protecting firms and clients requires an emphasis on controls that are practical and provable.</p><p></p><p><strong>Checklist 4</strong> – Whittley lists the critical client controls as:</p><ul><li><p>strong identity management;</p></li><li><p>verification steps for financial transactions;</p></li><li><p>restricted access to sensitive systems; and</p></li><li><p>regular review of logs and alerts.</p></li></ul><p>“Just as importantly, firms must be able to explain and evidence these controls when clients, insurers, or regulators ask how risk is being managed,” Whittley adds.</p><p></p><p><strong>Checklist 5</strong> – <a target=\"_blank\" data-router-slot=\"disabled\" href=\"https://services.google.com/fh/files/misc/cybersecurity-forecast-2026-en.pdf\" title=\"services.google.com\" type=\"external\">The Google report also warns of increasing cyber threats</a> from nation states including:</p><ul><li><p>Russia, concentrating on intelligence collection to support its global political and economic interests;</p></li><li><p>China, prioritising cyber espionage tactics;</p></li><li><p>Iran, focusing on cyber espionage, disruptive attacks and information operations targeting Israel and its allies; and</p></li><li><p>North Korea, targeting cryptocurrency organisations and users.</p></li></ul><p>However, Whittley says such nation-state activity should not be the primary driver of risk for most SMEs in Australia. “The overwhelming majority of incidents affecting this segment are caused by financially motivated criminal groups,” he says. “These groups operate on volume. They make thousands of attempts knowing only a small number need to succeed.”</p><p></p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"","columnContentAlignment":"","id":null,"key":"e124a859-d01f-432a-81cf-2f552dca11d4","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":null,"backgroundColor":null,"gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null},"jumpToId":"component-e124a859-d01f-432a-81cf-2f552dca11d4","sidebarMenuTitle":"Cybersecurity hygiene the key"},{"componentName":"copyBlock","componentData":{"contentColumnItems":[{"title":"<p><span class=\"text-2xl\"><strong>Be proactive</strong></span></p>","description":"<p>In a sign that technology and cyber threats are now whole-of-society factors, <a target=\"_blank\" data-router-slot=\"disabled\" href=\"https://edition.cnn.com/2025/10/14/tech/scouting-america-ai-cybersecurity-merit-badges\" title=\"edition.cnn.com\" type=\"external\">Scouting America, the group formerly known as the Boy Scouts</a>, will be giving scouts the chance to earn merit badges related to AI and cybersecurity. That is part of an effort to stay relevant in a digital world.</p><p></p><p>Herbert-Lowe encourages businesses to be similarly pre-emptive as they seek to repel cyber threats, rather than responding to government or regulatory demands. “At the end of the day, it’s really up to the businesses themselves to take the lead because of their position of trust. Every accounting practice has a legal duty to take reasonable care to prevent loss to its clients.”</p><p>Whittley notes that cybersecurity cannot eliminate all risk.</p><p></p><p>“But it’s about changing the economics so attackers move on to easier targets,” he concludes. “For most SMEs, demonstrable, well-managed controls are enough to achieve that – and to stand up confidently to scrutiny when it matters.”</p><p>Better to be stirred now, it seems, rather than shaken later.</p>","tagline":"","ctaLinkItem":[]}],"decoration":"","decorationWidth":"","decorationColour":null,"columnSpacing":"","columnContentAlignment":"","id":null,"key":"81f8a0e2-c726-4c52-b6db-48a9bf59de79","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":null,"backgroundColor":null,"gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null},"jumpToId":"component-81f8a0e2-c726-4c52-b6db-48a9bf59de79","sidebarMenuTitle":"Be proactive"}],"sidebarOnOff":true,"sidebarTitle":"Jump to","id":null,"key":"878c5593-ac26-4e7f-9d51-2699a2f46062","customCSSStyle":"","componentPadding":"","contentAlignment":"Left","backgroundConfiguration":"Full bleed","backgroundColor":"FFFFFF","gradientType":null,"foregroundColor":null,"desktopBackgroundImage":null,"mobileBackgroundImage":null,"title":null,"description":null}},{"componentName":"ctaSection","componentData":{"description":"<p><span class=\"text-lg\"><span style=\"font-size: 11pt; font-family: Aptos, sans-serif;\">Know someone doing great work in the profession that deserves recognition? Nominations them or yourself now. This year, winners will be celebrated like never before, with a spot-on a digital billboard in their local city. Nominations close 31 August.</span></span></p>","desktopImage":{"src":"/media/ia0p3klw/26me02_memberawards_webbanner_01.jpg?rmode=max&width=640&height=640","altText":"","target":null},"mobileImage":{"src":"/media/ia0p3klw/26me02_memberawards_webbanner_01.jpg?rmode=max&width=640&height=640","altTe
